<style>
:root{--ink:#171717;--paper:#f5f0e8;--card:#fffdf9;--red:#b8453b;--muted:#746e67;--line:#d9d0c5;--shadow:0 10px 28px rgba(20,20,20,.13)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:680px;margin:auto;padding:0 14px 34px}.top{padding:22px 4px 12px}.eyebrow{font:800 11px/1.2 "Courier New",monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}h1{margin:0;font:900 30px/1.02 Impact,"Arial Black",Arial,sans-serif;letter-spacing:-.4px;text-transform:uppercase}.hint{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:700}.filters{display:flex;gap:8px;overflow-x:auto;padding:7px 2px 12px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:linear-gradient(var(--paper) 80%,rgba(245,240,232,0))}.filters::-webkit-scrollbar,.thumbs::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;font-size:13px;white-space:nowrap;min-height:42px}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.photoWrap{position:relative;background:#eee;aspect-ratio:4/5}.photoLink{display:block;width:100%;height:100%}.photo{width:100%;height:100%;object-fit:cover;display:block}.source{position:absolute;top:12px;left:12px;background:rgba(255,253,249,.94);border:1px solid rgba(0,0,0,.1);border-radius:999px;padding:7px 10px;font:800 11px/1 Arial;letter-spacing:.6px;text-transform:uppercase}.heart{position:absolute;top:10px;right:10px;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,253,249,.95);font-size:25px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}.heart.saved{background:var(--red);color:#fff}.body{padding:15px 15px 16px}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{font:800 11px/1 "Courier New",monospace;color:var(--red);text-transform:uppercase;letter-spacing:1px}.count{font-size:12px;font-weight:800;color:var(--muted)}.title{font-size:21px;line-height:1.08;font-weight:900;margin:7px 0 14px}.actions{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}.nav,.shop{border:0;border-radius:13px;min-height:50px;font-weight:900}.nav{background:#ebe4dc;font-size:22px}.shop{background:var(--ink);color:#fff;font-size:14px}.shop:active,.nav:active,.heart:active,.chip:active{transform:scale(.98)}.thumbLabel{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 9px}.thumbLabel b{font-size:14px}.thumbLabel span{font-size:12px;color:var(--muted);font-weight:700}.thumbs{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}.thumb{flex:0 0 68px;height:84px;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#ddd;scroll-snap-align:start;position:relative}.thumb.active{border-color:var(--ink)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .miniheart{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:11px}.empty{display:none;text-align:center;padding:38px 18px;background:var(--card);border:1px solid var(--line);border-radius:20px}.empty.show{display:block}.empty b{display:block;font-size:18px;margin-bottom:6px}.empty p{margin:0;color:var(--muted);font-size:13px}.footer{padding:18px 4px 4px;text-align:center;color:var(--muted);font-size:11px;line-height:1.4}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){h1{font-size:38px}.app{padding-left:22px;padding-right:22px}.photoWrap{aspect-ratio:1/1.12}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="eyebrow">birthday outfit board</div><h1>Blink-182 Grunge Fits</h1><p class="hint">Swipe • tap the photo to shop • ♡ saves it</p></header>
<nav class="filters" aria-label="Filter outfits">
<button class="chip active" data-filter="all">All</button><button class="chip" data-filter="Vinted">Vinted</button><button class="chip" data-filter="Amazon">Amazon</button><button class="chip" data-filter="saved">♡ Saved <span id="savedCount">0</span></button>
</nav>
<main>
<section id="stage" class="stage" aria-live="polite">
<div class="photoWrap"><a id="photoLink" class="photoLink" target="_blank" rel="noopener"><img id="photo" class="photo" alt=""><span id="source" class="source"></span></a><button id="heart" class="heart" aria-label="Save outfit">♡</button></div>
<div class="body"><div class="meta"><span id="tag" class="tag"></span><span id="count" class="count"></span></div><div id="title" class="title"></div><div class="actions"><button id="prev" class="nav" aria-label="Previous outfit">‹</button><a id="shop" class="shop" target="_blank" rel="noopener" style="display:grid;place-items:center">View listing</a><button id="next" class="nav" aria-label="Next outfit">›</button></div></div>
</section>
<section id="empty" class="empty"><b>No saved looks yet ♡</b><p>Heart any outfit and it’ll show up here.</p></section>
<div class="thumbLabel"><b>All looks</b><span>tap a thumbnail to jump</span></div><div id="thumbs" class="thumbs"></div>
</main>
<div class="footer">Listings can change or sell. Tap through for current price, size and availability.</div>
</div><div id="toast" class="toast">Saved ♡</div>
<script>

{id:'a3',source:'Amazon',title:'Amazon outfit option',tag:'amazon',url:'https://a.co/d/05u760JW',image:'https://image.thum.io/get/width/700/crop/1100/noanimate/https://a.co/d/05u760JW'},

{id:'a8',source:'Amazon',title:'Loose distressed denim overalls',tag:'baggy',url:'https://a.co/d/0eEpa56I',image:'https://m.media-amazon.com/images/I/41tJaJwPFVL._AC_SL1000_.jpg'},

{id:'a10',source:'Amazon',title:'Corduroy harem overalls',tag:'corduroy',url:'https://a.co/d/03aDcTDE',image:'https://m.media-amazon.com/images/I/31eBZBqqEsL._AC_SL1000_.jpg'}];
let filter='all',index=0;const saved=new Set(JSON.parse(localStorage.getItem('blinkSaved')||'[]'));const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function list(){return items.filter(x=>filter==='all'||(filter==='saved'?saved.has(x.id):x.source===filter))}
function fallback(x){return 'https://image.thum.io/get/width/700/crop/1100/noanimate/'+x.url}
function render(){const arr=list();$('#savedCount').textContent=saved.size;$('#stage').style.display=arr.length?'block':'none';$('#empty').classList.toggle('show',!arr.length);if(!arr.length){renderThumbs(arr);return}if(index>=arr.length)index=arr.length-1;if(index<0)index=0;const x=arr[index];$('#photo').src=x.image;$('#photo').alt=x.title;$('#photo').onerror=function(){if(this.dataset.fallback!==x.id){this.dataset.fallback=x.id;this.src=fallback(x)}};$('#photoLink').href=x.url;$('#shop').href=x.url;$('#source').textContent=x.source;$('#tag').textContent=x.tag;$('#title').textContent=x.title;$('#count').textContent=(index+1)+' of '+arr.length;$('#heart').textContent=saved.has(x.id)?'♥':'♡';$('#heart').classList.toggle('saved',saved.has(x.id));$('#heart').setAttribute('aria-label',saved.has(x.id)?'Remove saved outfit':'Save outfit');renderThumbs(arr)}
function renderThumbs(arr){const t=$('#thumbs');t.innerHTML='';arr.forEach((x,i)=>{const b=document.createElement('button');b.className='thumb'+(i===index?' active':'');b.setAttribute('aria-label','Open '+x.title);const im=document.createElement('img');im.src=x.image;im.alt='';im.loading='lazy';im.onerror=function(){if(!this.dataset.tried){this.dataset.tried='1';this.src=fallback(x)}};b.appendChild(im);if(saved.has(x.id)){const h=document.createElement('span');h.className='miniheart';h.textContent='♥';b.appendChild(h)}b.onclick=()=>{index=i;render();b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})};t.appendChild(b)})}
function move(n){const arr=list();if(!arr.length)return;index=(index+n+arr.length)%arr.length;render();const active=$('.thumb.active');if(active)active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#heart').onclick=()=>{const arr=list(),x=arr[index];if(!x)return;if(saved.has(x.id))saved.delete(x.id);else saved.add(x.id);localStorage.setItem('blinkSaved',JSON.stringify([...saved]));showToast(saved.has(x.id)?'Saved ♡':'Removed');if(filter==='saved'&&!saved.has(x.id)){if(index>=list().length)index=Math.max(0,list().length-1)}render()};
$$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');filter=c.dataset.filter;index=0;render()});
let sx=0;$('#stage').addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>55)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let timer;function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1100)}render();
</script>
